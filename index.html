<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafetería y Papelería Colegial CCB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fdf2f4',
                            100: '#fbe5e9',
                            500: '#7A1C2E',
                            600: '#661726',
                            700: '#52121e',
                        }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen font-sans pb-24">

    <!-- Header -->
    <header class="bg-brand-500 text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center p-1 shadow">
                    <svg viewBox="0 0 200 200" class="w-full h-full text-brand-500 fill-current">
                        <circle cx="70" cy="100" r="50" fill="none" stroke="currentColor" stroke-width="16"/>
                        <circle cx="110" cy="100" r="50" fill="none" stroke="currentColor" stroke-width="16"/>
                        <path d="M 130 50 L 170 50 L 170 150 L 130 150 Z" />
                        <ellipse cx="145" cy="115" rx="8" ry="12" fill="white" transform="rotate(-20 145 115)"/>
                    </svg>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg tracking-tight">CAFETERÍA COLEGIAL CCB</h1>
                    <p class="text-xs text-brand-100">Alimentos, Bebidas y Útiles Escolares</p>
                </div>
            </div>
            <button onclick="toggleCartModal()" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 shadow">
                <i class="fas fa-shopping-cart"></i>
                <span>Carrito</span>
                <span id="cartBadge" class="bg-white text-brand-700 px-2 py-0.5 rounded-full text-xs font-black">0</span>
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- Formulario de Identificación -->
        <div class="lg:col-span-1 bg-white p-5 rounded-2xl shadow-sm border border-slate-200 h-fit sticky top-20">
            <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2 border-b pb-2">
                <i class="fas fa-id-card text-brand-500"></i> Identificación del Pedido
            </h2>
            
            <div class="space-y-4 text-sm">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Docente Solicitante:</label>
                    <input type="text" id="teacherName" placeholder="Ej: Prof. Carlos Mendoza" class="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 outline-none">
                </div>

                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Salón / Aula de Entrega:</label>
                    <select id="roomSelect" class="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 outline-none bg-white">
                        <option value="">Selecciona un Salón...</option>
                        <optgroup label="Piso 1 (Salones 101 - 110)">
                            <option value="101">Salón 101</option><option value="102">Salón 102</option>
                            <option value="103">Salón 103</option><option value="104">Salón 104</option>
                            <option value="105">Salón 105</option><option value="106">Salón 106</option>
                            <option value="107">Salón 107</option><option value="108">Salón 108</option>
                            <option value="109">Salón 109</option><option value="110">Salón 110</option>
                        </optgroup>
                        <optgroup label="Piso 2 (Salones 201 - 210)">
                            <option value="201">Salón 201</option><option value="202">Salón 202</option>
                            <option value="203">Salón 203</option><option value="204">Salón 204</option>
                            <option value="205">Salón 205</option><option value="206">Salón 206</option>
                            <option value="207">Salón 207</option><option value="208">Salón 208</option>
                            <option value="209">Salón 209</option><option value="210">Salón 210</option>
                        </optgroup>
                        <optgroup label="Piso 3 (Salones 301 - 310)">
                            <option value="301">Salón 301</option><option value="302">Salón 302</option>
                            <option value="303">Salón 303</option><option value="304">Salón 304</option>
                            <option value="305">Salón 305</option><option value="306">Salón 306</option>
                            <option value="307">Salón 307</option><option value="308">Salón 308</option>
                            <option value="309">Salón 309</option><option value="310">Salón 310</option>
                        </optgroup>
                    </select>
                </div>

                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Estudiante Encargado de Recoger:</label>
                    <input type="text" id="studentName" placeholder="Ej: Mateo Valencia" class="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 outline-none">
                </div>

                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Notas Especiales / Especificaciones:</label>
                    <textarea id="orderNote" rows="2" placeholder="Ej: Sándwich sin cebolla / 2 lápices..." class="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 outline-none text-xs"></textarea>
                </div>
            </div>
        </div>

        <!-- Catálogo de Productos -->
        <div class="lg:col-span-2 space-y-4">
            <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
                <button onclick="filterCategory('ALL')" class="cat-btn bg-brand-500 text-white px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap">Todos</button>
                <button onclick="filterCategory('COMIDA')" class="cat-btn bg-white text-slate-700 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap border">Comida y Snacks</button>
                <button onclick="filterCategory('BEBIDAS')" class="cat-btn bg-white text-slate-700 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap border">Bebidas</button>
                <button onclick="filterCategory('UTILES')" class="cat-btn bg-white text-slate-700 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap border">Útiles Escolares</button>
            </div>

            <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
        </div>
    </main>

    <!-- Modal Carrito -->
    <div id="cartModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white max-w-md w-full rounded-2xl p-6 shadow-2xl">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="font-extrabold text-lg text-slate-800">Resumen del Pedido</h3>
                <button onclick="toggleCartModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
            </div>

            <div id="cartItemsList" class="max-h-60 overflow-y-auto space-y-2 mb-4"></div>

            <div class="border-t pt-3 space-y-2 text-sm mb-6">
                <div class="flex justify-between font-bold text-slate-800 text-base">
                    <span>Total a Pagar:</span>
                    <span id="cartTotal" class="text-brand-500">$0</span>
                </div>
            </div>

            <button id="sendBtn" onclick="submitOrder()" class="w-full bg-brand-500 hover:bg-brand-600 text-white py-3 rounded-xl font-bold text-sm shadow-lg transition flex items-center justify-center gap-2">
                <i class="fas fa-paper-plane"></i> Enviar Pedido a Cocina
            </button>
        </div>
    </div>

    <script>
        const SYNC_CHANNEL = 'https://ntfy.sh/ccb_cafeteria_valencia_2026';

        const products = [
            { id: 1, name: 'Sándwich Jamón y Queso', price: 6000, category: 'COMIDA', icon: 'fa-hamburger' },
            { id: 2, name: 'Empanada de Carne', price: 3500, category: 'COMIDA', icon: 'fa-cookie' },
            { id: 3, name: 'Ensalada de Frutas', price: 4000, category: 'COMIDA', icon: 'fa-apple-alt' },
            { id: 4, name: 'Jugo Natural', price: 3000, category: 'BEBIDAS', icon: 'fa-glass-cheers' },
            { id: 5, name: 'Agua Mineral 500ml', price: 2000, category: 'BEBIDAS', icon: 'fa-bottle-water' },
            { id: 6, name: 'Cuaderno Cuadriculado', price: 5000, category: 'UTILES', icon: 'fa-book' },
            { id: 7, name: 'Bolígrafo Negro/Azul', price: 1500, category: 'UTILES', icon: 'fa-pen' },
            { id: 8, name: 'Lápiz Mirado 2', price: 1200, category: 'UTILES', icon: 'fa-pencil-alt' },
            { id: 9, name: 'Borrador de Nata', price: 1000, category: 'UTILES', icon: 'fa-eraser' }
        ];

        let cart = [];

        function renderProducts(cat = 'ALL') {
            const grid = document.getElementById('productsGrid');
            const items = cat === 'ALL' ? products : products.filter(p => p.category === cat);
            grid.innerHTML = items.map(p => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-brand-50 text-brand-500 rounded-xl flex items-center justify-center text-lg">
                            <i class="fas ${p.icon}"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-sm text-slate-800">${p.name}</h4>
                            <p class="text-xs text-brand-600 font-extrabold">$${p.price.toLocaleString()}</p>
                        </div>
                    </div>
                    <button onclick="addToCart(${p.id})" class="bg-brand-50 hover:bg-brand-500 hover:text-white text-brand-600 w-8 h-8 rounded-xl flex items-center justify-center font-bold transition">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            const item = cart.find(i => i.id === id);
            if(item) { item.qty++; } else { cart.push({ ...prod, qty: 1 }); }
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cartBadge').innerText = cart.reduce((acc, i) => acc + i.qty, 0);
            let total = 0;
            document.getElementById('cartItemsList').innerHTML = cart.map(i => {
                total += i.price * i.qty;
                return `
                    <div class="flex justify-between items-center text-sm p-2 bg-slate-50 rounded-xl">
                        <span class="font-semibold text-slate-700">${i.name} (x${i.qty})</span>
                        <span class="font-bold text-brand-600">$${(i.price * i.qty).toLocaleString()}</span>
                    </div>
                `;
            }).join('');
            document.getElementById('cartTotal').innerText = `$${total.toLocaleString()}`;
        }

        function toggleCartModal() {
            document.getElementById('cartModal').classList.toggle('hidden');
        }

        async function submitOrder() {
            const teacher = document.getElementById('teacherName').value.trim();
            const room = document.getElementById('roomSelect').value;
            const student = document.getElementById('studentName').value.trim();
            const note = document.getElementById('orderNote').value.trim();

            if(!teacher || !room || !student) {
                alert('Completa los campos: Profesor, Salón y Estudiante.');
                return;
            }
            if(cart.length === 0) {
                alert('Agrega al menos un producto al carrito.');
                return;
            }

            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';

            const newOrder = {
                id: 'CCB-' + Math.floor(10000 + Math.random() * 90000),
                teacher,
                room,
                student,
                note,
                items: [...cart],
                total: cart.reduce((acc, i) => acc + (i.price * i.qty), 0),
                status: 'RECIBIDO',
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                timestamp: Date.now()
            };

            // Guardar localmente
            let existingOrders = JSON.parse(localStorage.getItem('ccb_orders') || '[]');
            existingOrders.push(newOrder);
            localStorage.setItem('ccb_orders', JSON.stringify(existingOrders));

            try {
                // Enviar señal en tiempo real a la cocina vía NTFY
                await fetch(SYNC_CHANNEL, {
                    method: 'POST',
                    body: JSON.stringify(newOrder)
                });
                alert('¡Pedido enviado exitosamente a la cocina!');
                cart = [];
                updateCartUI();
                toggleCartModal();
            } catch(e) {
                alert('Pedido guardado localmente (sin internet).');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar Pedido a Cocina';
            }
        }

        function filterCategory(cat) { renderProducts(cat); }
        document.addEventListener('DOMContentLoaded', () => renderProducts());
    </script>
</body>
</html>
